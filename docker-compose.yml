services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: cafe123
      POSTGRES_DB: cafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CafeDb=Host=db;Port=5432;Database=cafe;Username=postgres;Password=cafe123
      - Jwt__SecretKey=${JWT_SECRET:-ESTA-E-UMA-CHAVE-SECRETA-BEM-GRANDE-PARA-DESENVOLVIMENTO-MINIMO-32-CHARS}
      - Jwt__Issuer=CafeApi
      - Jwt__Audience=CafeClient
    ports:
      - "8080:8080"

volumes:
  pgdata: